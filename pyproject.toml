[project]
name = "adaptive-rag"
version = "0.1.0"
description = "Adaptive RAG with scalable LLM orchestration, async APIs, and vector search"
requires-python = "~=3.12.11"
dependencies = [
    "langchain~=1.2.12",
    "langgraph~=1.1.2",
    "fastapi~=0.135.0",
    "uvicorn[standard]~=0.41.0",
    "streamlit~=1.55.0",
    "qdrant-client~=1.17.1",
    "langchain-qdrant~=1.1.0",
    "faiss-cpu~=1.13.2",  # uncomment for FAISS fallback mode
    "pymongo[srv]~=4.16.0",
    "motor~=3.7.1",
    "langchain-community~=0.4.1",
    "langchain-openai~=1.1.11",
    "tavily-python~=0.7.23",
    "pydantic~=2.12.5",
    "pydantic-settings~=2.13.1",
    "langsmith~=0.7.17",
    "httpx~=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "pre-commit",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["adaptive_rag"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "--cov=backend --cov-report=term-missing -v"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
